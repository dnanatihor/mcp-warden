[project]
name = "mcp-warden"
version = "0.1.0"
description = "Policy-enforcing gateway between AI agents and MCP servers"
authors = [
    { name = "Rohit Anand" }
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.14,<3",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "opentelemetry-api>=1.45.0",
    "pydantic>=2",
    "pyyaml>=6.0.3",
]

[project.scripts]
mcp-warden = "mcp_warden.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.format]
# SPEC.md is the source of truth; do not reflow its fenced examples.
exclude = ["SPEC.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mcp_warden"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "opentelemetry-sdk>=1.45.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff==0.16.4",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260906",
]
